<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a6f8c">
<title>Gezinti</title>
<meta name="description" content="Gezi planı, bütçe, bavul ve ev kontrol listeleri. Elle ya da kendi AI'ınla plan; eşinle ortak.">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: tek sütun, sticky sekme çubuğu; gün kartları zaman çizelgesi gibi */
:root{
  --bg:#f3f5f7;--surface:#ffffff;--fg:#17212b;--muted:#5d6b78;--line:#dde3e9;
  --accent:#c2381f;--accent-soft:#fbe7e2;--ink:#1d4a63;--ink-soft:#e2edf3;--ok:#2f7d4f;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c;--surface:#18212a;--fg:#e8edf1;--muted:#97a5b2;--line:#2a3640;
  --accent:#f0694d;--accent-soft:#3a1f19;--ink:#8cc3de;--ink-soft:#1c2f3b;--ok:#6cc790;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c;--surface:#18212a;--fg:#e8edf1;--muted:#97a5b2;--line:#2a3640;
  --accent:#f0694d;--accent-soft:#3a1f19;--ink:#8cc3de;--ink-soft:#1c2f3b;--ok:#6cc790;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{padding-top:22px;display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:6px}
nav button{flex:1;min-width:0;font:600 13.5px var(--body);white-space:nowrap;padding:10px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dhead h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.tag{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--ink-soft);color:var(--ink)}
.today .tag{background:var(--accent);color:var(--surface)}
.wx{font-size:13px;color:var(--muted);margin:0}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li.stop{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);font-size:14px}
.n{min-width:0}.n b{font-weight:600;display:block}.n small{color:var(--muted);font-size:13px}
.go{font:600 13px var(--body);text-decoration:none;color:var(--accent);background:var(--accent-soft);padding:7px 11px;border-radius:8px;white-space:nowrap}
.near{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.near a{font:600 12px var(--body);text-decoration:none;color:var(--ink);background:var(--ink-soft);padding:4px 9px;border-radius:99px;white-space:nowrap}
.quick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.quick p{margin:0;font-size:13px;color:var(--muted);font-weight:500}
.quick>div:not(.park){display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick>div:not(.park) a{text-align:center;font:600 13px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;color:var(--ink);background:var(--ink-soft);padding:11px 6px;border-radius:10px}
.cta{display:block;text-align:center;font:600 15px var(--body);text-decoration:none;background:var(--accent);color:#fff;padding:12px;border-radius:10px}
.panel{display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=number]{font:600 17px var(--body);padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums;width:100%;box-sizing:border-box}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
td{padding:7px 0;border-top:1px solid var(--line)}td:last-child{text-align:right}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:8px;border-top:2px solid var(--fg)}
.tot b{font-family:var(--display);font-size:30px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin:0}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h4{margin:6px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;color:var(--fg);font-size:15px;font-weight:400}
.chk input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.chk{justify-content:space-between}.chk .lbl{display:flex;flex-direction:row;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;font-size:15px;color:var(--fg);font-weight:400}
.chk .lbl span{overflow-wrap:anywhere}
.del{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.del:hover{background:var(--accent-soft);color:var(--accent)}
.add{display:flex;gap:8px;padding:8px 0 4px}
.add input{flex:1;min-width:0;font:400 15px var(--body);padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.add button{flex:none;font:600 14px var(--body);padding:0 14px;border-radius:9px;border:0;background:var(--ink);color:var(--surface);cursor:pointer}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pct{font-family:var(--display);font-size:28px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}
.grup-kart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.gust{display:flex;flex-direction:column;gap:2px}.gust b{font-weight:600;font-variant-numeric:tabular-nums}.gust small{color:var(--muted);font-size:13px}
.gbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gbtn button{font:600 14px var(--body);padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.gbtn button.ana{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--ink-soft);border-radius:12px}
.seg button{font:600 14px var(--body);padding:9px 6px;border:0;border-radius:9px;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.reset{align-self:flex-start;font:600 13px var(--body);padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.hava{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hbtn{font:600 14px var(--body);padding:10px;border-radius:10px;border:0;background:var(--ink-soft);color:var(--ink);cursor:pointer}
.hrow{display:flex;align-items:center;gap:12px}
.hico{font-size:38px;line-height:1}
.htmp{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.hdesc{display:flex;flex-direction:column;min-width:0}
.hdesc b{font-weight:600}.hdesc small{color:var(--muted);font-size:13px}
.hmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.hmeta span b{color:var(--fg);font-weight:600}
.hfoot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.hfoot button{font:600 12px var(--body);border:0;background:none;color:var(--ink);cursor:pointer;padding:0}
.prog{height:12px;background:var(--ink-soft);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
/* Sıradaki durak */
.sirada{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sust{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.setk{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.ssay{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.sad{display:flex;flex-direction:column;gap:3px}.sad b{font-family:var(--display);font-size:22px;line-height:1.15}.sad small{opacity:.85;font-size:13px}
.sbtn{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sbtn a{font:600 15px var(--body);text-decoration:none;padding:11px 16px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff}
.sbtn a.ana{background:#fff;color:var(--ink);flex:1;text-align:center;min-width:140px}
.scik{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;background:rgba(255,255,255,.14);padding:8px 10px;border-radius:10px}
.scik button{flex:none;font:600 12.5px var(--body);padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.vchip{align-self:flex-start;margin-top:5px;font:600 12.5px var(--body);padding:5px 10px;border-radius:99px;border:1px solid #3fa66a;background:transparent;color:#2f7d4f;cursor:pointer}
.vchip.geri{border-color:var(--line);color:var(--muted)}
.n{display:flex;flex-direction:column}.n>.rozet{align-self:flex-start}
.go.cik{color:var(--muted);background:var(--ink-soft)}
.dcik{grid-column:1/-1;flex-direction:row!important;align-items:center;gap:8px!important;color:var(--fg)!important;font-size:14px!important}
.dcik input{width:20px!important;height:20px;flex:none;accent-color:var(--ink)}
.ssonra{flex-basis:100%;opacity:.8;font-size:12.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sirada{background:#1c3a4c}}
:root[data-theme="dark"] .sirada{background:#1c3a4c}
/* Saat rozetleri */
.rozet{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--ink-soft);color:var(--ink)}
.rozet.yesil{background:#e3f4ea;color:#1f6b3d}.rozet.sari{background:#fff1d6;color:#8a5a00}.rozet.kirmizi{background:var(--accent-soft);color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rozet.yesil{background:#173323;color:#7fd6a0}:root:not([data-theme="light"]) .rozet.sari{background:#3a2e10;color:#fcd34d}}
.sirada .rozet{background:rgba(255,255,255,.18);color:#fff}
/* Plan düzenleme */
.pbar{display:flex;gap:8px;flex-wrap:wrap}
.pbar button,.stop.ekle button,.dbtn button,.dact button{font:600 14px var(--body);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.pbar button.ana,.dbtn button.ana{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.dact{display:flex;gap:4px}.dact button{padding:6px 10px}
li.stop.edit,li.stop.ekle{display:block}
.stop.ekle button{width:100%;border-style:dashed;color:var(--ink)}
.dform{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0}
.dform label:nth-child(2),.dform label:nth-child(3),.dform label:nth-child(4){grid-column:1/-1}
.dform input{font:400 15px var(--body);padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.dbtn{grid-column:1/-1;display:flex;gap:8px}
/* Acil */
.acil summary{font-family:var(--display);font-weight:600;font-size:17px;cursor:pointer}
.tlist{display:flex;flex-direction:column}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.tad{flex:1;min-width:140px;display:flex;flex-direction:column}.tad small{color:var(--muted);font-size:12.5px}
.tara{font:600 15px var(--body);text-decoration:none;background:var(--ok);color:#fff;padding:9px 14px;border-radius:10px;white-space:nowrap}
.tno{display:flex;gap:6px;flex-basis:100%}.tno input{flex:1;min-width:0;font:400 15px var(--body);padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.tno button{font:600 14px var(--body);padding:0 12px;border-radius:9px;border:0;background:var(--ink);color:var(--surface)}
.tbul{font-size:13px;color:var(--ink);font-weight:600}
.acil .add input{flex:1}
/* Masraf */
.pct.mas{color:var(--accent)}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mform select,.mform input{font:400 15px var(--body);padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box;min-width:0}
.mform input[type=number]{font-weight:600;font-variant-numeric:tabular-nums}
.mform button{grid-column:1/-1;font:600 15px var(--body);padding:11px;border-radius:10px;border:0;background:var(--ink);color:var(--surface);cursor:pointer}
.kat{display:flex;flex-direction:column;gap:8px}
.krow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}.krow b{font-variant-numeric:tabular-nums}
.kbar{grid-column:1/-1;height:6px;background:var(--ink-soft);border-radius:99px;overflow:hidden}.kbar i{display:block;height:100%;background:var(--accent)}
.mgun{border-top:1px solid var(--line);padding-top:8px}
.mgun summary{display:flex;justify-content:space-between;cursor:pointer;font-weight:600;padding:4px 0}
.mrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.mrow small{color:var(--muted)}.mrow b{font-variant-numeric:tabular-nums}
.yozet{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);background:var(--ink-soft);padding:10px 12px;border-radius:10px}
.yozet b{color:var(--fg);font-variant-numeric:tabular-nums}
/* Otoyol */
.oty{display:flex;flex-direction:column}
.orow{display:flex;flex-direction:row!important;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--fg)!important;font-size:14px!important}
.orow input{width:110px;flex:none;font:600 15px var(--body);padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
/* Hava: yer seçimi ve izin tarifi */
.hsehir{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hsehir small{color:var(--muted);font-size:12px}
.hsehir button{font:600 12.5px var(--body);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.hyol{margin:0;font-size:13px;line-height:1.45;background:var(--ink-soft);color:var(--fg);padding:10px 12px;border-radius:10px}
/* Saat değişkenliği */
.sgec{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sgec small{opacity:.8;font-size:12.5px}
.sgec button{font:600 13px var(--body);padding:7px 11px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer}
.sgec button.vard{background:#3fa66a;border-color:#3fa66a}
.smola{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:13.5px;font-weight:600;background:#f4b43a;color:#3a2600;padding:8px 10px;border-radius:10px}
.smola a{color:#3a2600}
.stop.vardi .n b::before{content:"✓ ";color:var(--ok)}
.stop.vardi{opacity:.75}
/* Park */
.park{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.pkaydet{font:600 14px var(--body);padding:11px;border-radius:10px;border:1px dashed var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.pmesaj{color:var(--muted);font-size:12.5px}
.pbilgi{display:flex;flex-direction:column}.pbilgi small{color:var(--muted);font-size:12.5px}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtns a,.pbtns button{font:600 13px var(--body);padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-decoration:none;cursor:pointer}
.pbtns a.ana{background:var(--ink);border-color:var(--ink);color:var(--surface)}
/* Tahmin ve günlük */
.tahmin{display:flex;flex-direction:column;gap:3px;margin:0;font-size:13.5px}
.tahmin .tet{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tahmin .rozet{align-self:flex-start}
.bnot{color:var(--muted);font-size:12px}
.gunluk{border-top:1px solid var(--line);padding-top:8px}
.gunluk summary{cursor:pointer;font-weight:600;color:var(--ink)}
.gnot{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:6px 0;font-size:14px;white-space:pre-wrap}
.gnot small{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.gunluk textarea{flex:1;min-width:0;font:400 15px var(--body);padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
/* Gün kartı: aç/kapa ve gün başında düzenle */
.dhead{align-items:center!important}
.dtoggle{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;color:var(--fg);cursor:pointer;text-align:left;min-width:0}
.dtoggle .ok{color:var(--muted);font-size:14px;width:14px}
.dsag{display:flex;align-items:center;gap:6px}
.dduz{font:600 13px var(--body);padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.dduz.ana{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.day.kapali{gap:4px;padding:12px 16px}
.day.bitti .dtoggle h2{color:var(--muted)}
.ozet{margin:0;color:var(--muted);font-size:13px}
.gsifirla{margin-top:8px;width:100%;font:600 13px var(--body);padding:8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
/* Fotoğraflar */
.fotolar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0}
.fk{position:relative;padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--ink-soft);cursor:zoom-in}
.fk img{width:100%;height:100%;object-fit:cover;display:block}
.fbekle{position:absolute;right:4px;bottom:4px;font-size:12px;background:rgba(0,0,0,.5);border-radius:6px;padding:1px 4px}

.tara.buyuk{text-align:center;padding:13px;font-size:17px}
a.mbtn{text-decoration:none;display:block}
input.otomatik{border-color:#3fa66a!important}
/* Uygulama içi pencere */
.dlg{position:fixed;inset:0;z-index:70;background:rgba(10,15,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dkutu{background:var(--surface);color:var(--fg);border-radius:16px;padding:18px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}

.dkutu input{font:400 16px var(--body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.dbtns{display:flex;gap:8px;justify-content:flex-end}
.dbtns button{font:600 15px var(--body);padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}

.dbtns .evet.tehlike{background:var(--accent);border-color:var(--accent);color:#fff}
.yoneri{max-height:216px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line)}
.yoneri:empty{display:none}
.kteshis{margin-top:6px;font-size:11.5px;color:var(--muted)}
/* ================= Yeni görünüm ================= */
:root{--bg:#f5f3ef;--surface:#ffffff;--fg:#1b2530;--muted:#6b7682;--line:#e6e2db;--ink:#1f5570;--ink-soft:#e8f0f4;--accent:#e2553a;--accent-soft:#fde9e4;--ok:#2f8a57;
  --golge:0 1px 2px rgba(27,37,48,.04),0 6px 20px rgba(27,37,48,.06);--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--surface:#182128;--fg:#e9eef2;--muted:#94a2ae;--line:#26323b;--ink:#8fc7e0;--ink-soft:#1b2c37;--accent:#ff7a5c;--accent-soft:#3a1f19;--ok:#5fcf8f;--golge:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
body{background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{gap:14px}
header{padding-top:18px;gap:2px}
h1{font-size:clamp(26px,7.5vw,34px);letter-spacing:-.02em}
.sub{font-size:14px}
.logo{display:flex;align-items:center;gap:10px}.lgi{font-size:30px;line-height:1}
/* Kartlar */
.card,.day,.hava,.grup-kart,.gkart,.baslat,.karsila{border:0!important;border-radius:var(--r);box-shadow:var(--golge);background:var(--surface)}
.day.today{box-shadow:0 0 0 2px var(--accent),var(--golge)}
/* Gezilerim */
.yeni-gezi{border-radius:16px;padding:16px;font-size:17px;box-shadow:0 6px 18px rgba(226,85,58,.28)}
.gkart{position:relative;padding:16px 18px 16px 22px;gap:4px;overflow:hidden}
.gkart::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ink)}
.gkart.suruyor::before{background:var(--accent)}.gkart.bitti::before{background:var(--line)}
.gkart.suruyor{box-shadow:var(--golge)}
.gsay{position:absolute;top:14px;right:16px;background:var(--ink-soft);padding:3px 10px;border-radius:99px;font-size:12px!important}
.karsila{padding:16px;display:flex;flex-direction:column;gap:12px}
.karsila .bos{text-align:left;padding:0;color:var(--fg);font-weight:600}
.adimk{display:flex;gap:12px;align-items:flex-start}.adimk div{display:flex;flex-direction:column}.adimk small{color:var(--muted);font-size:13px}
.adno{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink-soft);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px}
/* Üst çubuk */
.ubar button{border:0;background:var(--surface);box-shadow:var(--golge);border-radius:12px}
/* Alt menü */
nav.altnav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav.altnav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0!important;background:transparent!important;color:var(--muted)!important;padding:6px 2px;font:600 11.5px var(--body);border-radius:12px}
nav.altnav .ni{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
nav.altnav button[aria-selected="true"]{color:var(--ink)!important;background:var(--ink-soft)!important}
nav.altnav button[aria-selected="true"] .ni{filter:none;opacity:1}
@media (min-width:700px){nav.altnav{left:50%;transform:translateX(-50%);max-width:640px;bottom:12px;border-radius:20px;border:1px solid var(--line);box-shadow:var(--golge)}}
/* Araçlar satırı */
.araclar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;-webkit-overflow-scrolling:touch}
.araclar::-webkit-scrollbar{display:none}
.arac{flex:none;font:600 13.5px var(--body);text-decoration:none;white-space:nowrap;padding:9px 14px;border-radius:99px;border:0;background:var(--surface);color:var(--fg);box-shadow:var(--golge);cursor:pointer}
.arac.vurgu{background:var(--ink);color:var(--surface)}
/* AI ve durak */
.aibar{grid-template-columns:1fr 1fr}
.aibar button{border-radius:14px;border:0;box-shadow:var(--golge);padding:13px}
.baslat{padding:18px;display:flex;flex-direction:column;gap:6px}
.baslat b{font-family:var(--display);font-size:20px}.baslat small{color:var(--muted);font-size:13.5px;margin-bottom:8px}
.baslat .aibar button{box-shadow:none;border:1px solid var(--line)}
/* Gün kartı */
.day{padding:16px 16px 10px;gap:10px}
.dhead{align-items:center!important}
.dbaslik{display:flex;flex-direction:column;gap:0}
.gno{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.dtoggle h2{font-size:18px;font-family:var(--display);font-weight:600}
.dtoggle .ok{align-self:center}
.tag{background:var(--ink-soft);color:var(--ink)}
.dduz{border:0!important;background:var(--ink-soft)!important;color:var(--ink)!important}
.dduz.ana{background:var(--ink)!important;color:var(--surface)!important}
.yerbtn{border:0;background:var(--ink-soft);padding:6px 12px}
.cta{border-radius:12px;background:var(--ink);font-size:14.5px;padding:11px}
.wx{display:none}
/* Zaman çizgisi */
ol{gap:0}
li.stop{grid-template-columns:46px 1fr auto;border-top:0!important;padding:0;align-items:stretch}
li.stop .t{padding-top:10px;font-size:13.5px;color:var(--muted);font-weight:600}
li.stop .n{position:relative;border-left:2px solid var(--line);padding:9px 0 14px 16px;gap:2px}
li.stop .n::before{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
li.stop.vardi .n::before{background:var(--ok);border-color:var(--ok)}
li.stop:last-child .n{border-left-color:transparent}
li.stop .n b{font-size:15.5px}
li.stop .n small{font-size:13px;line-height:1.4}
.sagbtn{padding-top:8px}
.go{border-radius:10px;padding:7px 12px}
.telbtn{border:0;background:var(--ink-soft);opacity:.6}.telbtn.var{opacity:1}
li.stop.ekle,li.stop.bosgun{padding:6px 0}
.near a{background:var(--bg)}
.gunluk{border-top:1px solid var(--line);padding:10px 0 4px}
/* Sıradaki durak */
.sirada{background:linear-gradient(140deg,#1f5570,#2b7593)!important;border-radius:22px;box-shadow:0 10px 30px rgba(31,85,112,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sirada{background:linear-gradient(140deg,#173f53,#1f5a72)!important}}
/* Hava: sade */
.hava{padding:12px 16px;gap:6px}
.hico{font-size:32px}.htmp{font-size:30px}
.hmeta{font-size:12.5px}
.hsehir button{background:var(--bg);border:0}
/* Bütçe, listeler, modal */
.mform select,.mform input,.add input,.dform input{background:var(--bg)!important;border-color:transparent!important}
.mform button,.add button{border-radius:12px}
.seg{background:var(--surface);box-shadow:var(--golge);border-radius:14px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.mkutu{border-radius:22px 22px 0 0}
.mbtn{border:0;box-shadow:var(--golge)}
.acilic .tlist{padding:0}
.grup-kart{padding:16px}
/* Taşma düzeltmesi ve açılır öneri listesi */
html,body{overflow-x:hidden}
.panel,.day,main,.wrap{min-width:0}
li.stop{grid-template-columns:46px minmax(0,1fr) auto!important}
li.stop .n{min-width:0}li.stop .n b,li.stop .n small{overflow-wrap:anywhere}
.aibar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
.yersec{position:relative}
.yoneri{position:absolute;left:0;right:0;top:calc(100% - 2px);z-index:30;max-height:none!important;border:1px solid var(--line)!important;border-radius:12px;background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden}
.yoneri button{flex-direction:row!important;align-items:baseline!important;gap:8px!important;padding:11px 12px!important;white-space:nowrap;overflow:hidden}

.yoneri .yok{display:block;padding:10px 12px}
main#ana{width:100%;max-width:none;margin:0!important}
.ysecili[hidden]{display:none!important}
.kmsonuc{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.card .grid{align-items:end}
/* Örnek gezi bandı */
.ornekbant{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,#fff3e6,#fde9e4);color:#5a2a12}

.ornekbant b{font-size:16px}.ornekbant small{font-size:13px;line-height:1.45;opacity:.9}
.obtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.obtn button{font:600 13.5px var(--body);padding:9px 14px;border-radius:10px;border:0;background:rgba(255,255,255,.7);color:inherit;cursor:pointer}
.obtn button.ana{background:var(--accent);color:#fff}
.karsila .reset{align-self:flex-start;font:600 14px var(--body);padding:10px 14px;border-radius:10px;border:0;background:var(--ink-soft);color:var(--ink);cursor:pointer}
/* Yer alanı ve tam ekran arama */
.yalan{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:400 16px var(--body);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}

.yalan .ymetin{flex:1;min-width:0;display:flex;flex-direction:column}.yalan .ymetin b{font-weight:600}.yalan .ymetin small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yalan .ydeg{flex:none;font-size:12.5px;font-weight:600;color:var(--ink)}

<script>
/* ================= Gezinti 2 — genel gezi uygulaması =================
   Veriler bu cihazda (localStorage "g2:" ön ekiyle) tutulur; grup kodu varsa Firestore ile eşitlenir.
   Belgeler: "geziler" (gezi listesi) ve "{geziId}_{bölüm}" (plan, masraf, park, gunluk, telefon, listeler). */
const SYNC=window.SYNC={kod:null,yaz:null,f:null,abone:null};
const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x};
const link=(href,cls,txt)=>{const a=el("a",cls,txt);a.href=href;if(!href.startsWith("tel:")){a.target="_blank";a.rel="noopener"}return a};
const btn=(txt,cls,f)=>{const b=el("button",cls,txt);b.type="button";if(f)b.onclick=f;return b};
const M=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const NEAR=(w,q)=>M(w+" near "+q);
const HERE=w=>"https://www.google.com/maps/search/"+encodeURIComponent(w)+"/";
const YAKIN=[["⛽ Benzin","benzin istasyonu"],["🅿️ Otopark","otopark"],["💊 Eczane","eczane"],["🏥 Hastane","hastane"],["🛒 Market","market"]];

/* ---------- Uygulama içi pencereler (tarayıcının onay/soru pencereleri bazı uygulama içi tarayıcılarda açılmıyor) ---------- */
function dialog({mesaj,girdi,deger,evet="Tamam",hayir="Vazgeç",tehlike}){return new Promise(ok=>{
  const d=el("div","dlg");const k=el("div","dkutu");k.setAttribute("role","alertdialog");k.append(el("p",null,mesaj));let i=null;
  if(girdi){i=el("input");i.value=deger||"";k.append(i)}
  const b=el("div","dbtns");const kapat=v=>{d.remove();ok(v)};
  if(hayir!==null)b.append(btn(hayir,"hayir",()=>kapat(girdi?null:false)));
  b.append(btn(evet,"evet"+(tehlike?" tehlike":""),()=>kapat(girdi?i.value:true)));
  k.append(b);d.append(k);document.body.append(d);
  if(i){i.onkeydown=e=>{if(e.key==="Enter")kapat(i.value)};setTimeout(()=>i.focus(),30)}})}
const onay=window.onay=(m,o={})=>dialog(Object.assign({mesaj:m,evet:"Evet",tehlike:/sil|kaldır|ayrıl/i.test(m)},o));
const soru=window.soru=(m,v)=>dialog({mesaj:m,girdi:true,deger:v});
const uyar=window.uyar=m=>dialog({mesaj:m,hayir:null});
const yeniId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dk=t=>{if(!t)return null;const [h,m]=t.split(":").map(Number);return h*60+m};
const gece=m=>m!=null&&m<300?m+1440:m;
const pad=n=>String(n).padStart(2,"0");
const tarihStr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const bugunStr=()=>tarihStr(new Date());
const tarihEkle=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return tarihStr(d)};
const gunFark=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const gunAdi=d=>new Date(d+"T12:00:00").toLocaleDateString("tr-TR",{weekday:"long"});
const gunUzun=d=>new Date(d+"T12:00:00").toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
const tarihKisa=d=>new Date(d+"T12:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"short"});
const zamanOf=s=>{const d=new Date(s.d+"T"+(s.t||"00:00")+":00");if(dk(s.t)<300)d.setDate(d.getDate()+1);return d};
const cikisMi=s=>s.c===true;
const saatEkle=(t,d)=>{let m=(dk(t)+d)%1440;if(m<0)m+=1440;return pad(Math.floor(m/60))+":"+pad(m%60)};
function sure(ms){const m=Math.round(ms/60000);if(m<60)return m+" dk";const h=Math.floor(m/60),r=m%60;if(h<24)return h+" sa"+(r?" "+r+" dk":"");const g=Math.floor(h/24);return g+" gün"+(h%24?" "+(h%24)+" sa":"")}
const para=n=>(Math.round(n)||0).toLocaleString("tr-TR")+" ₺";
/* Durağın haritadaki hedefi: Google linki > koordinat > arama metni */
/* "Git/Haritada": yer adıyla açılır ki Google puanı ve saatleri görünsün; yol tarifi tam koordinata gider */
const hedefURL=s=>s.gl?s.gl:s.q?M(s.q):(s.la&&s.lo)?"https://www.google.com/maps/search/?api=1&query="+s.la+","+s.lo:M(s.n);
const yolURL=s=>"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent((s.la&&s.lo)?s.la+","+s.lo:(s.q||s.n));
const navURL=s=>(s.gl&&!(s.la&&s.lo))?s.gl:yolURL(s);
const haritaVar=s=>!!(s.gl||s.q||(s.la&&s.lo));

/* ---------- Yerel depolama + eşitlenen depo ---------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem("g2:"+k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem("g2:"+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem("g2:"+k)}catch(e){}}};
const DEPO={};window.DEPO_=DEPO;
function depo(id,varsayilan){
  if(DEPO[id])return DEPO[id];
  let items=(LS.get(id)||{}).items;if(!items||typeof items!=="object")items=varsayilan?varsayilan():{};
  const sakla=()=>LS.set(id,{items});
  const yaz=(d,tam)=>{sakla();if(SYNC.yaz)SYNC.yaz(id,d,tam);ciz()};
  const o=DEPO[id]={
    get items(){return items},
    koy(k,v){items[k]=Object.assign(items[k]||{},v);yaz({[k]:v})},
    toplu(d){Object.entries(d).forEach(([k,v])=>{if(v===null)delete items[k];else items[k]=Object.assign(items[k]||{},v)});yaz(d)},
    sil(k){delete items[k];yaz({[k]:null})},
    sessiz(k,v){items[k]=Object.assign(items[k]||{},v);sakla();if(SYNC.yaz)SYNC.yaz(id,{[k]:v})},
    hepsi:()=>items,
    tamYaz(v){items=v;yaz(null,items)},
    uzak(v){items=v&&typeof v==="object"?v:{};sakla();cizNazik()}};
  if(SYNC.abone)SYNC.abone(id);
  return o;
}
/* Ekranı topluca yeniden çiz (kısa aralıklarla gelen değişiklikleri birleştirir) */
let cizBekliyor=false;
function ciz(){if(cizBekliyor)return;cizBekliyor=true;requestAnimationFrame(()=>{cizBekliyor=false;goster()})}

const GEZI=depo("geziler");
let aktif=LS.get("aktif");
const gezi=()=>aktif&&GEZI.items[aktif]?GEZI.items[aktif]:null;
const D=ad=>depo(aktif+"_"+ad,VARSAYILAN[ad]);
const gunler=g=>{const n=gunFark(g.bas,g.son)+1;return Array.from({length:Math.max(1,Math.min(n,60))},(_,i)=>tarihEkle(g.bas,i))};
const durum=g=>{const b=bugunStr();return b<g.bas?"yaklasan":b>g.son?"bitti":"suruyor"};
const yerOf=(g,d)=>(g.gunler&&g.gunler[d]&&g.gunler[d].yer)||g.yer||null;

/* ---------- Varsayılan listeler ---------- */
const listeYap=(bolumler,v)=>{const o={};let s=1;bolumler.forEach(b=>(v[b]||[]).forEach(t=>{o["v"+s]={t,b,ok:false,s:s++}}));return o};
const BAVUL_B=["Giyim","Ayakkabı","Yol","Kişisel bakım","Özel eşya"];
const EV_B=["Gaz ve mutfak","Su ve elektrik","Güvenlik","Ev işleri","Araç"];
const VARSAYILAN={
  bavulOneri:()=>listeYap(BAVUL_B,{
    "Giyim":["Gün sayısı kadar üst","Polar ya da sweatshirt","Yağmurluk / ince mont","Kalın mont (soğuk sabahlar için)","Rahat pantolon","İç çamaşırı ve çorap","Pijama","Yedek kıyafet seti"],
    "Ayakkabı":["Rahat yürüyüş ayakkabısı","Yedek ayakkabı","Terlik"],
    "Yol":["Şemsiye","Güneş gözlüğü","Su ve atıştırmalık","Telefon araç tutucu","Araç şarjı ve kablolar","Powerbank","Islak mendil ve peçete","Çöp poşeti","Biraz nakit"],
    "Kişisel bakım":["Diş fırçası ve macun","Şampuan / duş jeli","Deodorant","Tarak / fırça","Nemlendirici ve dudak kremi","Güneş kremi","Düzenli kullanılan ilaçlar","Ağrı kesici","Mide ilacı","Yara bandı","Gözlük / lens"],
    "Özel eşya":["Kimlik","Ehliyet ve ruhsat","Banka kartları","Otel rezervasyonları","Müzekart","Telefon şarj kablosu","Kulaklık","Ev anahtarı","Yedek araç anahtarı"]}),
  evOneri:()=>listeYap(EV_B,{
    "Gaz ve mutfak":["Doğalgaz vanası kapalı","Ocak ve fırın kapalı","Kombi tatil / ekonomi modunda","Buzdolabında bozulacak yiyecek kalmadı","Çöpler çıkarıldı"],
    "Su ve elektrik":["Ana su vanası kapalı","Musluklar kapalı","Çamaşır makinesinin musluğu kapalı","Ütü, kettle, saç kurutma fişte değil","Gereksiz cihazların fişi çekildi","Işıklar kapalı"],
    "Güvenlik":["Pencereler kapalı ve kilitli","Balkon kapısı kilitli","Değerli eşyalar kaldırıldı","Komşuya haber verildi","Kapı kilitlendi","Ev anahtarı yanımda"],
    "Ev işleri":["Çiçekler sulandı","Makinede çamaşır kalmadı","Kargolar ertelendi"],
    "Araç":["Depo dolu","Lastik basıncı","Yağ ve su","Silecek suyu","HGS bakiyesi"]}),
  telefon:()=>({t1:{n:"Kasko / yol yardım",no:"",s:1},t2:{n:"Otel",no:"",s:2}})
};

/* ---------- Ekranlar ---------- */
const ust=document.getElementById("ust"),ana=document.getElementById("ana"),sirada=document.getElementById("sirada");
let sekme=LS.get("sekme")||"plan",duzenle=null,gunAcik={};
function bildirimGoster(){if(!hizliBilgi)return;const t=el("div","toast",hizliBilgi);hizliBilgi=null;document.body.append(t);setTimeout(()=>t.classList.add("acik"),20);setTimeout(()=>{t.classList.remove("acik");setTimeout(()=>t.remove(),300)},3500)}
function goster(){setTimeout(bildirimGoster,50);
  /* Modal açıkken yazılan formu bozmamak için arka planı çizmeyi ertele */
  if(modalAcik()){cizErtele=true;return}
  /* Sıradaki durak kartı program sekmesinde bugünün kartının üstüne taşınır; yeniden çizmeden önce yerine al */
  ana.before(sirada);
  const g=gezi();ust.textContent="";ana.textContent="";
  if(!g){evEkrani();sirada.hidden=true;return}
  geziEkrani(g);siradaCiz();bugunAtla();
}
let cizErtele=false;

/* ===== Gezilerim ===== */
function evEkrani(){
  const lg=el("div","logo");lg.append(el("span","lgi","🧭"),el("h1",null,"Gezinti"));ust.append(lg,el("p","sub","Gezilerin, planların ve listelerin tek yerde"));
  const liste=Object.entries(GEZI.items).filter(([,g])=>g&&g.ad&&g.bas);
  const sira={suruyor:0,yaklasan:1,bitti:2};
  liste.sort((a,b)=>sira[durum(a[1])]-sira[durum(b[1])]||(durum(a[1])==="bitti"?b[1].bas.localeCompare(a[1].bas):a[1].bas.localeCompare(b[1].bas)));
  ana.append(btn("+ Yeni gezi","yeni-gezi",()=>geziFormu()));
  if(!liste.length){const k=el("div","karsila");k.append(el("p","bos","Henüz gezi yok. Üç adımda başla:"));
    [["1","Gezini oluştur","Ad, tarih ve gideceğin şehir."],["2","Durakları ekle","Elle ya da kendi AI'ınla (Claude, ChatGPT, Gemini)."],["3","Yolda kullan","Sıradaki durak, yol tarifi, masraf, bavul listesi."]]
      .forEach(([n,b,t])=>{const r=el("div","adimk");r.append(el("span","adno",n));const x=el("div");x.append(el("b",null,b),el("small",null,t));r.append(x);k.append(r)});
    k.append(btn("👀 Örnek bir geziye göz at","reset",()=>{LS.del("ornekSilindi");ornekOlustur();geziAc(ORNEK)}));ana.append(k)}
  liste.forEach(([id,g])=>{
    const k=el("button","gkart "+durum(g));k.type="button";k.onclick=()=>geziAc(id);
    const n=gunFark(g.bas,g.son)+1;
    const yerler=[...new Set(gunler(g).map(d=>yerOf(g,d)?.ad).filter(Boolean))].slice(0,4).join(" · ");
    k.append(el("span","gdurum",(g.ornek?"Örnek · ":"")+{suruyor:"● Şu an",yaklasan:"Yaklaşan",bitti:"Bitti"}[durum(g)]),el("b",null,g.ad),
      el("small",null,tarihKisa(g.bas)+(n>1?" – "+tarihKisa(g.son):"")+" · "+n+" gün"+(yerler?" · "+yerler:"")));
    if(durum(g)==="yaklasan"){const f=gunFark(bugunStr(),g.bas);k.append(el("small","gsay",f===1?"Yarın":f+" gün sonra"))}
    ana.append(k)});
  const gk=el("div","grup-kart");ana.append(gk);if(window.grupCiz)grupCiz();
  if(v1Var()&&!GEZI.items[V1ID])ana.append(btn("Eski uygulamadaki gezini aktar","reset",()=>{LS.del("v1Silindi");v1Aktar(true);ciz()}));
}
function geziAc(id){aktif=id;LS.set("aktif",id);duzenle=null;gunAcik={};bugunModu();window.scrollTo(0,0);ciz()}
/* Bugün modu: süren bir gezi açılınca program sekmesi açılır ve sayfa bugünün kartına (sıradaki durağa) kayar */
let atla=false;
function bugunModu(){const g=gezi();if(g&&durum(g)==="suruyor"){sekme="plan";LS.set("sekme","plan");atla=true}}
function bugunAtla(){if(!atla)return;atla=false;if(sekme!=="plan")return;
  const hedef=()=>(!sirada.hidden&&sirada.closest(".panel"))?sirada:document.querySelector(".day.today");if(!hedef())return;

function gunSirasi(d){return duraklarOf().filter(([,s])=>s.d===d).sort((a,b)=>(gece(dk(a[1].t))??-1)-(gece(dk(b[1].t))??-1)).map(([id])=>id)}
function siraDegis(d,ids){
  const P=D("plan"),dk_=t=>gece(dk(t));
  const slot=ids.map(id=>P.items[id].t).filter(Boolean).sort((a,b)=>dk_(a)-dk_(b));
  if(slot.length<ids.length){let son=slot.length?slot[slot.length-1]:"09:00";while(slot.length<ids.length){son=saatEkle(son,60);slot.push(son)}}
  for(let i=1;i<slot.length;i++)if(dk_(slot[i])<=dk_(slot[i-1]))slot[i]=saatEkle(slot[i-1],5);
  const y={};ids.forEach((id,i)=>{if(P.items[id].t!==slot[i])y[id]={t:slot[i]}});if(Object.keys(y).length)P.toplu(y)}
function tasi(d,id,yon){const ids=gunSirasi(d),i=ids.indexOf(id),j=i+yon;if(i<0||j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];siraDegis(d,ids)}

  e.preventDefault();const ol=li.parentElement,ogeler=[...ol.querySelectorAll("li.stop[data-id]")],bas=e.clientY;let hedef=ogeler.indexOf(li);

  const hareket=ev=>{li.style.transform="translateY("+(ev.clientY-bas)+"px)";const r=li.getBoundingClientRect(),orta=r.top+r.height/2;
    let k=0;ogeler.forEach(o=>{if(o===li)return;const q=o.getBoundingClientRect();if(orta>q.top+q.height/2)k++});hedef=k;
    const gor=ogeler.filter(o=>o!==li);isaret(k<gor.length?ogeler.indexOf(gor[k]):ogeler.length)};

/* ---------- Saat rozetleri ---------- */
function saatRozeti(s){
  if(!s.ac&&!s.kp)return null;const ac=dk(s.ac),kp=gece(dk(s.kp)),pl=gece(dk(s.t));const r=el("span","rozet");
  if(s.d===bugunStr()){const n=new Date();let m=n.getHours()*60+n.getMinutes();if(m<300)m+=1440;
    if(ac!=null&&m<ac){r.classList.add("kirmizi");r.textContent=`Şu an kapalı · ${s.ac}'da açılır`}
    else if(kp!=null&&m>=kp){r.classList.add("kirmizi");r.textContent=`Şu an kapalı · ${s.kp}'da kapandı`}
    else if(kp!=null&&kp-m<=60){r.classList.add("sari");r.textContent=`Kapanmasına ${kp-m} dk · ${s.kp}`}
    else if(ac!=null){r.classList.add("yesil");r.textContent="Şu an açık"+(s.kp?` · ${s.kp}'da kapanır`:"")}
    else r.textContent=`🕘 ${s.kp}'da kapanır`;return r}
  if(pl==null){r.textContent="🕘 "+[s.ac||"…",s.kp||"…"].join("–");return r}
  if(ac!=null&&pl<ac){r.classList.add("sari");r.textContent=`⚠ ${s.ac}'da açılıyor, plan saati erken`}
  else if(kp!=null&&pl>=kp){r.classList.add("kirmizi");r.textContent=`⚠ ${s.kp}'da kapanıyor, plan saati geç`}
  else if(kp!=null&&kp-pl<=60){r.classList.add("sari");r.textContent=`${s.kp}'da kapanıyor, vaktin az`}
  else r.textContent="🕘 "+[s.ac||"…",s.kp||"…"].join("–");
  return r}

function siradaCiz(){
  const g=gezi();if(!g||modalAcik()){if(!g)sirada.hidden=true;return}

      const m=v.trim().match(/^(\d{1,2})[:.]?(\d{2})$/);if(!m||+m[1]>23||+m[2]>59)return uyar("Saati 06:15 gibi yaz.");
      const d=gece(+m[1]*60+ +m[2])-gece(dk(cik.s.t));if(d)kaydirGun(cik.s.d,cik.z,d)}));sirada.append(row)}

function sonKaydirma(){const x=LS.get("sonKaydirma");return x&&x.g===aktif&&Date.now()-x.t<6*3600e3?x:null}
function kaydir(list,i,d,haric){const h=list[i];let bas=haric?h.z+1:h.z;
  if(!haric){const c=list.slice(0,i).filter(x=>x.s.d===h.s.d&&cikisMi(x.s)&&!x.s.v&&x.z>=Date.now()-20*60e3).pop();if(c)bas=c.z}
  kaydirGun(h.s.d,bas,d)}
function kaydirGun(gun,bas,d){
  const ids=duraklarOf().filter(([,s])=>s.d===gun&&s.t&&!s.v&&zamanOf(s).getTime()>=bas).map(([id])=>id);if(!ids.length)return;

function geriAl(){const x=sonKaydirma();if(!x)return;const P=D("plan"),y={};x.ids.forEach(k=>{if(P.items[k])y[k]={t:saatEkle(P.items[k].t,-x.d)}});LS.del("sonKaydirma");P.toplu(y)}
async function varis(id){

  if(Math.abs(fark)>10&&Math.abs(fark)<=240){const yv=Math.round(fark/5)*5,m=Math.abs(yv);
    if(await onay(`Plandan ${m} dk ${yv>0?"geç":"erken"} vardın. Bugünün kalan durakları da ${m} dk ${yv>0?"ileri kaydırılsın":"öne çekilsin"} mi?`))kaydirGun(x.s.d,x.z+1,yv)}
}

\`\`\``}

<script type="module">
/* Ortak kullanım: Firebase (Spark, ücretsiz). Grup kodunu bilen herkes aynı gezileri görür.
   Ayar kodu gizli değildir; erişimi Firestore kuralları ve tahmin edilemez 12 haneli kod korur. */
const CFG={apiKey:"AIzaSyC7K-D1bZKEmpJXJqR4ulkFoQE_86CRm1A",authDomain:"gezinti-5393d.firebaseapp.com",projectId:"gezinti-5393d",
  storageBucket:"gezinti-5393d.firebasestorage.app",messagingSenderId:"680019243670",appId:"1:680019243670:web:86177138c733f667ca88b7"};
const V="10.12.2",ABC="ABCDEFGHJKMNPQRSTUVWXYZ23456789",KEY="grup-kod";
const SYNC=window.SYNC,DEPO=window.DEPO_;
let fb=null,abonelik={},durum="kapali",mesaj="";
const goster=k=>k.match(/.{4}/g).join("-");
const temizle=x=>String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const gecerli=k=>k.length===12&&[...k].every(c=>ABC.includes(c));
const yeniKod=()=>{const a=new Uint32Array(12);crypto.getRandomValues(a);return [...a].map(x=>ABC[x%ABC.length]).join("")};
async function firebase(){if(fb)return fb;const u=n=>`https://www.gstatic.com/firebasejs/${V}/firebase-${n}.js`;
  const [{initializeApp},fs]=await Promise.all([import(u("app")),import(u("firestore"))]);const app=initializeApp(CFG);
  let db;try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
  fb={db,...fs};return fb}
function hata(e){console.error(e);durum="hata";mesaj=e&&e.code==="permission-denied"?"Veritabanı izin vermedi.":"Bağlantı kurulamadı. İnternet gelince sayfayı yenile; veriler bu telefonda duruyor.";grupCiz()}
function abone(id){
  const f=fb,kod=SYNC.kod;if(!f||!kod||abonelik[id])return;
  const ref=f.doc(f.db,"gruplar",kod,"g2",id);let ilk=true;
  abonelik[id]=f.onSnapshot(ref,snap=>{const d=DEPO[id];if(!d)return;
    if(!snap.exists()){if(!snap.metadata.fromCache&&ilk){ilk=false;f.setDoc(ref,{items:d.hepsi()}).catch(hata)}return}
    let uz=snap.data().items||{};
    /* Gezi listesi: bu telefonda olup grupta olmayan geziler kaybolmasın, gruba eklensin */
    if(id==="geziler"&&ilk&&!snap.metadata.fromCache){const ek={};Object.entries(d.hepsi()).forEach(([k,v])=>{if(!uz[k])ek[k]=v});
      if(Object.keys(ek).length){uz=Object.assign({},uz,ek);f.setDoc(ref,{items:ek},{merge:true}).catch(hata)}}
    if(!snap.metadata.fromCache)ilk=false;
    d.uzak(uz);if(durum!=="bagli"){durum="bagli";mesaj="";grupCiz()}
  },hata)}
async function baglan(kod){
  SYNC.kod=kod;durum="baglaniyor";mesaj="";grupCiz();
  try{const f=await firebase();Object.values(abonelik).forEach(x=>x());abonelik={};if(SYNC.kod!==kod)return;
    SYNC.f=f;
    SYNC.yaz=(id,degisim,tam)=>{const ref=f.doc(f.db,"gruplar",kod,"g2",id);if(tam)return f.setDoc(ref,{items:tam}).catch(hata);
      const items={};Object.entries(degisim||{}).forEach(([k,v])=>items[k]=v===null?f.deleteField():v);if(Object.keys(items).length)f.setDoc(ref,{items},{merge:true}).catch(hata)};
    SYNC.abone=abone;Object.keys(DEPO).forEach(abone);
    window.dispatchEvent(new Event("grup"));window.ciz();
  }catch(e){hata(e)}}
function ayril(){Object.values(abonelik).forEach(x=>x());abonelik={};SYNC.kod=null;SYNC.yaz=null;SYNC.f=null;SYNC.abone=null;
  try{localStorage.removeItem(KEY)}catch(e){}durum="kapali";mesaj="";window.dispatchEvent(new Event("grup"));window.ciz()}
async function kur(kod,soruMetni){if(soruMetni&&!await onay(soruMetni))return;try{localStorage.setItem(KEY,kod)}catch(e){}baglan(kod)}
async function davet(){const kod=SYNC.kod;if(!kod)return;const url=location.origin+location.pathname+"#grup="+goster(kod),metin="Gezilerimize katıl. Grup kodu: "+goster(kod);
  try{if(navigator.share){await navigator.share({title:"Gezinti",text:metin,url});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(metin+"\n"+url);uyar("Davet linki kopyalandı. Mesajla gönder.")}catch(e){await soru("Bu linki kopyalayıp gönder:",url)}}
function grupCiz(){document.querySelectorAll(".grup-kart").forEach(k=>{k.textContent="";const u=document.createElement("div");u.className="gust";
  const b=document.createElement("b"),s=document.createElement("small");u.append(b,s);const bt=document.createElement("div");bt.className="gbtn";
  const btn=(t,f,ana)=>{const x=document.createElement("button");x.type="button";x.textContent=t;x.onclick=f;if(ana)x.className="ana";bt.append(x)};
  if(SYNC.kod){b.textContent="👥 Grup "+goster(SYNC.kod);s.textContent=durum==="bagli"?"✓ Bağlı · geziler grupla anlık ortak":durum==="baglaniyor"?"Bağlanıyor…":mesaj;
    btn("Davet et",davet,true);btn("Ayrıl",async ()=>{if(await onay("Gruptan ayrılınca veriler bu telefonda kalır ama artık eşitlenmez. Ayrılınsın mı?"))ayril()})}
  else{b.textContent="👥 Ortak kullanım";s.textContent=durum==="baglaniyor"?"Bağlanıyor…":(mesaj||"Eşinle ya da birlikte gezdiğin kişilerle aynı gezileri, listeleri ve masrafları paylaş.");
    btn("Grup oluştur",()=>kur(yeniKod(),"Yeni grup oluşturulsun mu? Bu telefondaki geziler gruba yüklenir."),true);
    btn("Koda katıl",async ()=>{const k=temizle(await soru("Grup kodunu yaz (örn. ABCD-EFGH-JKMN):"));if(!k)return;if(!gecerli(k))return uyar("Kod hatalı görünüyor. 12 harf ve rakamdan oluşmalı.");
      kur(k,"Gruba katılınca grubun gezileri bu telefona gelir. Devam edilsin mi?")})}
  k.append(u,bt)})}
window.grupCiz=grupCiz;
const m=location.hash.match(/grup=([A-Za-z0-9-]+)/);
if(m){history.replaceState(null,"",location.pathname+location.search);const k=temizle(m[1]);
  if(gecerli(k)&&k!==SYNC.kod)kur(k,"Davet edildiğin gruba ("+goster(k)+") katılmak ister misin?")}
let kayitli=null;try{kayitli=localStorage.getItem(KEY)}catch(e){}
if(!SYNC.kod&&kayitli&&gecerli(kayitli))baglan(kayitli);
grupCiz();

</script>
